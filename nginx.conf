server {
    listen 80;
    server_name 47.116.41.98;

    # 根路径 → 跳转到 EduAgent
    location = / {
        return 302 /edu/;
    }

    # ============================================
    # 项目1: EduAgent → http://47.116.41.98/edu/
    # 用 rewrite 去掉 /edu/ 前缀再转发
    # ============================================
    location /edu/ {
        rewrite ^/edu/(.*) /$1 break;
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    # ============================================
    # 项目2: Realtime Collab Doc → http://47.116.41.98/new/
    # ============================================
    location /new/ {
        proxy_pass http://collab-frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /new/api/ {
        proxy_pass http://collab-backend:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /new/ws/ {
        proxy_pass http://collab-backend:8081/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
