server {
    listen 80;
    server_name 47.116.41.98;

    # 根路径 → EduAgent
    location = / {
        return 302 /edu/;
    }

    # ============================================
    # 项目1: EduAgent → http://47.116.41.98/edu/
    # ============================================
    location /edu/ {
        rewrite ^/edu/(.*) /$1 break;
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    # ============================================
    # 项目2: Realtime Collab Doc → http://47.116.41.98/new/
    # ============================================
    location /new/ {
        proxy_pass http://realtime-collab-doc-frontend-1:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 新项目的静态资源（assets 路径重写）
    location /assets/ {
        proxy_pass http://realtime-collab-doc-frontend-1:80;
        proxy_set_header Host $host;
    }

    location /new/api/ {
        proxy_pass http://realtime-collab-doc-frontend-1:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
